<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de IMC</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="calculadora">
            <h1>Calculadora de IMC</h1>
            
            <form id="formImc">
                <div class="form-group">
                    <label for="peso">Peso (kg):</label>
                    <input type="number" id="peso" placeholder="Ex: 70" min="1" max="300" step="0.1" required>
                </div>

                <div class="form-group">
                    <label for="altura">Altura (cm):</label>
                    <input type="number" id="altura" placeholder="Ex: 175" min="1" max="250" step="0.1" required>
                </div>

                <button type="button" class="btn-calcular" onclick="calcularImc()">Calcular IMC</button>
                <button type="reset" class="btn-limpar" onclick="limparForm()">Limpar</button>
            </form>

            <div id="resultado" class="resultado" style="display:none;">
                <div class="imc-valor">
                    <span>Seu IMC:</span>
                    <h2 id="valorImc">-</h2>
                </div>
                <div id="classificacao" class="classificacao">-</div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
